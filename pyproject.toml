# pip install .   ->   the "lexitap" command (needs Python with Tk; on Linux e.g. apt install python3-tk)
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lexitap"
dynamic = ["version"]
description = "PDF viewer: select text across lines and pages, translate whole sentences into Chinese with an LLM"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pymupdf>=1.24,<2"]  # version 2 works too, but is three times the download

[project.gui-scripts]
lexitap = "lexitap:main"

[tool.setuptools]
py-modules = ["lexitap"]

[tool.setuptools.dynamic]
version = { attr = "lexitap.__version__" }
